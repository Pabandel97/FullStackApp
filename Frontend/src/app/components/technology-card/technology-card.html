<div class="card">
    <img 
        [src]="technology.logo" 
        [alt]="technology.name" 
        class="card-img-top img-fluid"
    />

    <div class="card-body">
        <h4 class="card-title">{{technology.name}}</h4>
        <p class="card-text">{{technology.description}}</p>
        <p class="card-text">
            @for (tag of technology.tags; track tag) {
                <small class="text-muted"> #{{ tag }}</small>
            } @empty {
                <small class="text-muted">No tags</small>
            }
        </p>
        <a [routerLink]="['/technology', technology._id]" class="btn btn-outline-primary">See more</a>
    </div>
</div>
